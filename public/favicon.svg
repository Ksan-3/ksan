<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="100" fill="#0A1128" />
  
  <!-- Outer Gold/Emerald Glow or Gradient Border effect (simplified for SVG) -->
  <rect width="360" height="360" x="20" y="20" rx="80" fill="none" stroke="#D4AF37" stroke-width="12" stroke-dasharray="60 20" />

  <!-- Inner Chart Elements -->
  <!-- Emerald Green Bar -->
  <rect x="100" y="220" width="40" height="80" rx="10" fill="#10B981" />
  <!-- Gold Bar -->
  <rect x="180" y="160" width="40" height="140" rx="10" fill="#D4AF37" />
  <!-- Accent Red / Positive Growth Bar -->
  <rect x="260" y="80" width="40" height="220" rx="10" fill="#EF4444" />

  <!-- Uptrend Line -->
  <path d="M 120 200 L 200 130 L 280 40" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Uptrend Line Shadow/Glow -->
  <circle cx="280" cy="40" r="16" fill="#FFFFFF" />
  
  <!-- Text Label -->
  <text x="200" y="360" font-family="'Pretendard', sans-serif, 'Noto Sans KR'" font-size="44" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">재테크 픽</text>
</svg>
